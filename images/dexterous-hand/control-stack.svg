<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">灵巧手控制与触觉闭环</title>
  <desc id="desc">任务层经过接触规划、手指控制和执行器作用于灵巧手与物体，触觉、本体感知和视觉反馈回状态估计。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="1" stop-color="#11183b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14294c"/>
      <stop offset="1" stop-color="#182047"/>
    </linearGradient>
    <linearGradient id="sense" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowSense" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <path d="M0 510 C210 430 330 590 540 515 S900 450 1200 540" fill="none" stroke="#15335e" stroke-width="2" opacity="0.7"/>
  <text x="60" y="66" fill="#f8fafc" font-size="30" font-weight="700" font-family="Microsoft YaHei, sans-serif">灵巧手控制与触觉闭环</text>
  <text x="60" y="100" fill="#8fa9c7" font-size="17" font-family="Microsoft YaHei, sans-serif">高层决定任务，低层守住接触与安全，传感器让动作持续修正</text>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="55" y="158" width="205" height="142" rx="18" fill="url(#card)" stroke="#2d5f9a"/>
    <circle cx="91" cy="194" r="15" fill="#2563eb"/>
    <text x="120" y="203" fill="#f8fafc" font-size="23" font-weight="700">任务层</text>
    <text x="82" y="240" fill="#b9c9dd" font-size="16">物体目标位姿</text>
    <text x="82" y="269" fill="#b9c9dd" font-size="16">抓取与操作原语</text>

    <rect x="315" y="158" width="225" height="142" rx="18" fill="url(#card)" stroke="#2d5f9a"/>
    <circle cx="351" cy="194" r="15" fill="#4f46e5"/>
    <text x="380" y="203" fill="#f8fafc" font-size="23" font-weight="700">接触规划</text>
    <text x="342" y="240" fill="#b9c9dd" font-size="16">接触点与模式</text>
    <text x="342" y="269" fill="#b9c9dd" font-size="16">目标力与内部力</text>

    <rect x="595" y="158" width="225" height="142" rx="18" fill="url(#card)" stroke="#2d5f9a"/>
    <circle cx="631" cy="194" r="15" fill="#7c3aed"/>
    <text x="660" y="203" fill="#f8fafc" font-size="23" font-weight="700">手指控制</text>
    <text x="622" y="240" fill="#b9c9dd" font-size="16">位置 / 力矩</text>
    <text x="622" y="269" fill="#b9c9dd" font-size="16">阻抗与安全限幅</text>

    <rect x="875" y="158" width="270" height="142" rx="18" fill="url(#card)" stroke="#d97706"/>
    <circle cx="911" cy="194" r="15" fill="#f59e0b"/>
    <text x="940" y="203" fill="#f8fafc" font-size="23" font-weight="700">灵巧手 + 物体</text>
    <text x="902" y="240" fill="#d8c6a3" font-size="16">关节、传动与软指腹</text>
    <text x="902" y="269" fill="#d8c6a3" font-size="16">接触、滚动、滑移、脱离</text>
  </g>

  <g fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)">
    <path d="M260 229 H305"/>
    <path d="M540 229 H585"/>
    <path d="M820 229 H865"/>
  </g>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="170" y="408" width="210" height="112" rx="18" fill="#0b3448" stroke="#17a6c0"/>
    <text x="275" y="449" fill="#e6fbff" text-anchor="middle" font-size="21" font-weight="700">状态估计</text>
    <text x="275" y="483" fill="#9edbe4" text-anchor="middle" font-size="15">手、物体、接触模式</text>

    <rect x="475" y="408" width="175" height="112" rx="18" fill="#24204d" stroke="#8b5cf6"/>
    <text x="562" y="449" fill="#f2efff" text-anchor="middle" font-size="21" font-weight="700">触觉</text>
    <text x="562" y="483" fill="#c4b5fd" text-anchor="middle" font-size="15">力、剪切、滑移</text>

    <rect x="685" y="408" width="175" height="112" rx="18" fill="#24204d" stroke="#8b5cf6"/>
    <text x="772" y="449" fill="#f2efff" text-anchor="middle" font-size="21" font-weight="700">本体感知</text>
    <text x="772" y="483" fill="#c4b5fd" text-anchor="middle" font-size="15">关节、电流、张力</text>

    <rect x="895" y="408" width="175" height="112" rx="18" fill="#24204d" stroke="#8b5cf6"/>
    <text x="982" y="449" fill="#f2efff" text-anchor="middle" font-size="21" font-weight="700">视觉</text>
    <text x="982" y="483" fill="#c4b5fd" text-anchor="middle" font-size="15">物体与全局几何</text>
  </g>

  <g fill="none" stroke="url(#sense)" stroke-width="3" marker-end="url(#arrowSense)">
    <path d="M1010 300 V365 H562 V398"/>
    <path d="M1010 300 V365 H772 V398"/>
    <path d="M1010 300 V365 H982 V398"/>
    <path d="M475 464 H390"/>
    <path d="M685 464 H660 C560 464 480 560 380 500"/>
    <path d="M895 464 H870 C670 570 480 570 380 490"/>
    <path d="M275 408 V350 C275 330 428 330 428 310"/>
  </g>

  <text x="600" y="580" fill="#7d95b3" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">触觉必须改变后续控制命令，才真正形成闭环</text>
</svg>
