<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">触觉信号处理链</title>
  <desc id="desc">原始触觉经过同步标定、接触特征提取和状态估计后，进入控制器调整手指动作，并由新的接触结果反馈。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061829"/>
      <stop offset="1" stop-color="#151637"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg2)"/>
  <text x="60" y="64" fill="#f8fafc" font-size="29" font-weight="700" font-family="Microsoft YaHei, sans-serif">从原始触觉到可控制状态</text>
  <text x="60" y="98" fill="#8fa9c7" font-size="17" font-family="Microsoft YaHei, sans-serif">信号只有经过同步、解释并改变动作，才具有控制价值</text>

  <path d="M120 219 H1080" stroke="url(#flow)" stroke-width="5" opacity="0.35" filter="url(#glow)"/>

  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <g>
      <circle cx="125" cy="219" r="66" fill="#0d3145" stroke="#22d3ee" stroke-width="2"/>
      <text x="125" y="210" fill="#e6fbff" font-size="20" font-weight="700">原始触觉</text>
      <text x="125" y="240" fill="#9edbe4" font-size="14">图像 / taxel / 磁场</text>
    </g>
    <g>
      <circle cx="365" cy="219" r="66" fill="#102b4d" stroke="#38bdf8" stroke-width="2"/>
      <text x="365" y="210" fill="#eff8ff" font-size="20" font-weight="700">同步与标定</text>
      <text x="365" y="240" fill="#a9d8ef" font-size="14">时间戳 / 基线 / 增益</text>
    </g>
    <g>
      <circle cx="605" cy="219" r="66" fill="#172750" stroke="#60a5fa" stroke-width="2"/>
      <text x="605" y="210" fill="#eff5ff" font-size="20" font-weight="700">特征提取</text>
      <text x="605" y="240" fill="#b9d3ff" font-size="14">接触 / 力 / 剪切 / 滑移</text>
    </g>
    <g>
      <circle cx="845" cy="219" r="66" fill="#25204f" stroke="#8b5cf6" stroke-width="2"/>
      <text x="845" y="210" fill="#f5f1ff" font-size="20" font-weight="700">接触状态</text>
      <text x="845" y="240" fill="#c9bdff" font-size="14">稳定 / 初滑 / 完全滑移</text>
    </g>
    <g>
      <circle cx="1080" cy="219" r="66" fill="#351f4b" stroke="#c084fc" stroke-width="2"/>
      <text x="1080" y="210" fill="#fbf3ff" font-size="20" font-weight="700">动作调整</text>
      <text x="1080" y="240" fill="#e1c5f6" font-size="14">位姿 / 阻抗 / 夹持力</text>
    </g>
  </g>

  <g fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow2)">
    <path d="M194 219 H288"/>
    <path d="M434 219 H528"/>
    <path d="M674 219 H768"/>
    <path d="M914 219 H1003"/>
  </g>

  <path d="M1080 288 C1080 370 620 382 365 310 C260 280 200 293 160 319" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow2)"/>
  <text x="628" y="365" fill="#a99ec9" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">新动作产生新的接触，下一周期继续估计与修正</text>
</svg>
