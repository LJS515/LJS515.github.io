<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">机器人示教 episode 的时间同步结构</title>
  <desc id="desc">相机、人体输入、机器人状态和控制命令以不同频率采样，通过设备时间戳对齐到策略时钟，同时保存事件和元数据。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172a"/>
      <stop offset="1" stop-color="#171638"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg2)"/>
  <text x="55" y="61" fill="#f8fafc" font-size="29" font-weight="700" font-family="Microsoft YaHei, sans-serif">一个 episode，不止一条数组</text>
  <text x="55" y="95" fill="#8fa9c7" font-size="17" font-family="Microsoft YaHei, sans-serif">保留原始时间戳，再对齐到策略时钟；不要用消息到达顺序冒充采样顺序</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <text x="55" y="153" fill="#a8c7e8" font-size="16">相机 30 Hz</text>
    <line x1="180" y1="148" x2="1080" y2="148" stroke="#1e4970" stroke-width="2"/>
    <g fill="#22d3ee">
      <circle cx="210" cy="148" r="7"/><circle cx="330" cy="148" r="7"/><circle cx="450" cy="148" r="7"/><circle cx="570" cy="148" r="7"/><circle cx="690" cy="148" r="7"/><circle cx="810" cy="148" r="7"/><circle cx="930" cy="148" r="7"/><circle cx="1050" cy="148" r="7"/>
    </g>

    <text x="55" y="213" fill="#b8b2ea" font-size="16">人体输入 60 Hz</text>
    <line x1="180" y1="208" x2="1080" y2="208" stroke="#3d316d" stroke-width="2"/>
    <g fill="#a78bfa">
      <circle cx="195" cy="208" r="5"/><circle cx="255" cy="208" r="5"/><circle cx="315" cy="208" r="5"/><circle cx="375" cy="208" r="5"/><circle cx="435" cy="208" r="5"/><circle cx="495" cy="208" r="5"/><circle cx="555" cy="208" r="5"/><circle cx="615" cy="208" r="5"/><circle cx="675" cy="208" r="5"/><circle cx="735" cy="208" r="5"/><circle cx="795" cy="208" r="5"/><circle cx="855" cy="208" r="5"/><circle cx="915" cy="208" r="5"/><circle cx="975" cy="208" r="5"/><circle cx="1035" cy="208" r="5"/>
    </g>

    <text x="55" y="273" fill="#a8c7e8" font-size="16">机器人状态 200 Hz</text>
    <line x1="180" y1="268" x2="1080" y2="268" stroke="#1e4970" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M190 268 L220 252 L250 276 L280 258 L310 272 L340 248 L370 270 L400 255 L430 275 L460 250 L490 268 L520 257 L550 273 L580 249 L610 270 L640 253 L670 276 L700 251 L730 269 L760 256 L790 274 L820 250 L850 268 L880 254 L910 276 L940 252 L970 270 L1000 256 L1030 272 L1060 250" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <text x="55" y="333" fill="#e7b8c2" font-size="16">事件 / 接管</text>
    <line x1="180" y1="328" x2="1080" y2="328" stroke="#5d2a3f" stroke-width="2"/>
    <rect x="388" y="315" width="16" height="26" rx="4" fill="#fb7185"/>
    <rect x="748" y="315" width="16" height="26" rx="4" fill="#fb7185"/>
    <rect x="988" y="315" width="16" height="26" rx="4" fill="#fb7185"/>

    <rect x="175" y="385" width="910" height="75" rx="18" fill="#132d55" stroke="#60a5fa"/>
    <text x="205" y="415" fill="#f1f6ff" font-size="18" font-weight="700">策略时钟</text>
    <text x="205" y="444" fill="#a8c7e8" font-size="14">每个 tₖ：最近有效图像 + 插值状态 + 对齐动作 + 事件标记 + 各模态时间差</text>

    <g stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)">
      <path d="M450 155 V375"/><path d="M615 215 V375"/><path d="M790 275 V375"/><path d="M996 335 V375"/>
    </g>

    <rect x="850" y="28" width="295" height="75" rx="16" fill="#29204f" stroke="#8b5cf6"/>
    <text x="872" y="58" fill="#f4f0ff" font-size="17" font-weight="700">episode metadata</text>
    <text x="872" y="84" fill="#c9bdff" font-size="13">校准、机器人、操作者、控制器、软件版本</text>
  </g>
</svg>
