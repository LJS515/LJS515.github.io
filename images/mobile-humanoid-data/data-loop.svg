<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">移动操作与人形示教数据闭环</title>
  <desc id="desc">Mobile ALOHA 通过同构遥操作直接采集移动双臂数据，HumanPlus 通过人体估计、重定向和全身控制采集人形数据，两条路线都进入数据清洗、策略训练和自主执行闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="1" stop-color="#16163a"/>
    </linearGradient>
    <linearGradient id="mobile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="56" y="61" fill="#f8fafc" font-size="30" font-weight="700" font-family="Microsoft YaHei, sans-serif">两种本体，一条数据闭环</text>
  <text x="56" y="96" fill="#8fa9c7" font-size="17" font-family="Microsoft YaHei, sans-serif">人类输入先变成安全可执行的机器人动作，再变成可训练的 observation-action 序列</text>

  <g font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)">
    <rect x="55" y="140" width="185" height="170" rx="20" fill="url(#mobile)" stroke="#2dd4bf"/>
    <text x="147" y="184" fill="#ecfeff" text-anchor="middle" font-size="22" font-weight="700">Mobile ALOHA</text>
    <text x="147" y="224" fill="#b9f3ef" text-anchor="middle" font-size="15">leader 双臂</text>
    <text x="147" y="253" fill="#b9f3ef" text-anchor="middle" font-size="15">夹爪 + 底盘输入</text>
    <text x="147" y="282" fill="#b9f3ef" text-anchor="middle" font-size="15">同构遥操作</text>

    <rect x="300" y="140" width="205" height="170" rx="20" fill="#10334f" stroke="#38bdf8"/>
    <text x="402" y="184" fill="#effaff" text-anchor="middle" font-size="22" font-weight="700">机器人执行</text>
    <text x="402" y="224" fill="#b9dff2" text-anchor="middle" font-size="15">双臂与夹爪</text>
    <text x="402" y="253" fill="#b9dff2" text-anchor="middle" font-size="15">移动底盘</text>
    <text x="402" y="282" fill="#b9dff2" text-anchor="middle" font-size="15">多相机观测</text>

    <rect x="55" y="356" width="185" height="190" rx="20" fill="url(#human)" stroke="#a78bfa"/>
    <text x="147" y="400" fill="#f5f3ff" text-anchor="middle" font-size="22" font-weight="700">HumanPlus</text>
    <text x="147" y="439" fill="#d8d0ff" text-anchor="middle" font-size="15">人体与手部估计</text>
    <text x="147" y="468" fill="#d8d0ff" text-anchor="middle" font-size="15">形态重定向</text>
    <text x="147" y="497" fill="#d8d0ff" text-anchor="middle" font-size="15">置信度与限幅</text>
    <text x="147" y="526" fill="#d8d0ff" text-anchor="middle" font-size="15">HST shadowing</text>

    <rect x="300" y="356" width="205" height="190" rx="20" fill="#2d2459" stroke="#a78bfa"/>
    <text x="402" y="400" fill="#f8f5ff" text-anchor="middle" font-size="22" font-weight="700">人形执行</text>
    <text x="402" y="439" fill="#d8d0ff" text-anchor="middle" font-size="15">全身平衡</text>
    <text x="402" y="468" fill="#d8d0ff" text-anchor="middle" font-size="15">足底接触</text>
    <text x="402" y="497" fill="#d8d0ff" text-anchor="middle" font-size="15">第一视角观测</text>
    <text x="402" y="526" fill="#d8d0ff" text-anchor="middle" font-size="15">真实执行状态</text>

    <rect x="580" y="195" width="210" height="300" rx="22" fill="#132d55" stroke="#60a5fa"/>
    <text x="685" y="240" fill="#eff6ff" text-anchor="middle" font-size="23" font-weight="700">同步数据集</text>
    <text x="685" y="284" fill="#bdd5f8" text-anchor="middle" font-size="15">图像与时间戳</text>
    <text x="685" y="315" fill="#bdd5f8" text-anchor="middle" font-size="15">机器人状态</text>
    <text x="685" y="346" fill="#bdd5f8" text-anchor="middle" font-size="15">控制命令</text>
    <text x="685" y="377" fill="#bdd5f8" text-anchor="middle" font-size="15">人类原始输入</text>
    <text x="685" y="408" fill="#bdd5f8" text-anchor="middle" font-size="15">成功 / 失败 / 接管</text>
    <rect x="621" y="441" width="128" height="30" rx="15" fill="#1d4ed8"/>
    <text x="685" y="462" fill="#ffffff" text-anchor="middle" font-size="14">清洗与分段</text>

    <rect x="855" y="195" width="150" height="130" rx="20" fill="url(#shared)" stroke="#818cf8"/>
    <text x="930" y="244" fill="#f8f7ff" text-anchor="middle" font-size="21" font-weight="700">策略训练</text>
    <text x="930" y="278" fill="#d9dcff" text-anchor="middle" font-size="15">BC / ACT</text>
    <text x="930" y="302" fill="#d9dcff" text-anchor="middle" font-size="15">HIT / 多任务</text>

    <rect x="855" y="390" width="150" height="130" rx="20" fill="#3b1d62" stroke="#c084fc"/>
    <text x="930" y="439" fill="#fbf7ff" text-anchor="middle" font-size="21" font-weight="700">自主执行</text>
    <text x="930" y="473" fill="#e4ccfa" text-anchor="middle" font-size="15">安全限幅</text>
    <text x="930" y="497" fill="#e4ccfa" text-anchor="middle" font-size="15">真机 rollout</text>

    <rect x="1060" y="278" width="100" height="160" rx="20" fill="#3b2335" stroke="#fb7185"/>
    <text x="1110" y="321" fill="#fff1f2" text-anchor="middle" font-size="19" font-weight="700">失败</text>
    <text x="1110" y="354" fill="#fecdd3" text-anchor="middle" font-size="14">标注</text>
    <text x="1110" y="381" fill="#fecdd3" text-anchor="middle" font-size="14">接管</text>
    <text x="1110" y="408" fill="#fecdd3" text-anchor="middle" font-size="14">回流</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M240 225 H290" stroke="#38bdf8" marker-end="url(#arrowCyan)"/>
    <path d="M505 225 C545 225 545 300 570 300" stroke="#38bdf8" marker-end="url(#arrowCyan)"/>
    <path d="M240 451 H290" stroke="#a78bfa" marker-end="url(#arrowViolet)"/>
    <path d="M505 451 C545 451 545 390 570 390" stroke="#a78bfa" marker-end="url(#arrowViolet)"/>
    <path d="M790 300 H845" stroke="#60a5fa" marker-end="url(#arrowCyan)"/>
    <path d="M930 325 V380" stroke="#a78bfa" marker-end="url(#arrowViolet)"/>
    <path d="M1005 455 C1040 455 1040 405 1050 405" stroke="#fb7185" marker-end="url(#arrowViolet)"/>
    <path d="M1110 438 V590 H685 V505" stroke="#fb7185" stroke-dasharray="9 8" marker-end="url(#arrowViolet)"/>
  </g>

  <text x="600" y="618" fill="#8fa0bc" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">最有价值的数据往往来自策略失败后的人工恢复</text>
</svg>
